        <span class="hexf hexf--p5" style="--dx:40px; --dy:110px; --d:1.4s"></span>
        <span class="hexf hexf--p6" style="--dx:120px; --dy:60px; --d:1.75s"></span>

    </div>
  </div>
</div>

function qrBlock(path, size){

  const s = size || 120;
  return `<div class="qr-wrap"><img src="${esc(path)}" alt="QR" width="${s}" height="${s}" /><span>Aponte a câmera</span></div>`;
}

let slides=[...document.querySelectorAll('.slide')];
const body=document.body;
const btnPresent=document.getElementById('btnPresent');
const btnPresentHero=document.getElementById('btnPresentHero');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const exitBtn=document.getElementById('exitBtn');
const slideCount=document.getElementById('slideCount');
const toast=document.getElementById('toast');
let idx=0, presenting=false, animating=false;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function updateCount(){
  slideCount.textContent=`${idx+1} / ${slides.length}`;
  slides.forEach((s,i)=>{
    const on = !presenting || i===idx || s.classList.contains('entering');
    if(presenting && i!==idx && !s.classList.contains('leaving') && !s.classList.contains('entering')){
      s.classList.remove('active');
    }
    s.style.pointerEvents = on ? '' : 'none';
    if('inert' in s) s.inert = presenting && !on;
    s.setAttribute('aria-hidden', presenting && !on ? 'true' : 'false');
  });
}
function sleep(ms){return new Promise(r=>setTimeout(r, ms))}
function resetMorph(){ morphStage.className = 'morph-stage'; }

async function playMorphTransition(onMid){
  if(reduceMotion){ if(onMid) onMid(); return; }
  resetMorph();
  morphStage.classList.add('on','form');
  await sleep(2500);
  morphStage.classList.remove('form');
  morphStage.classList.add('hold');
  await sleep(280);
  morphStage.classList.remove('hold');
  morphStage.classList.add('bloom');
  await sleep(180);
  if(onMid) onMid();
  await sleep(1200);
  resetMorph();
}

async function showSlide(next){
  if(animating || next===idx){ updateCount(); return; }
  if(!presenting){
    idx=next; updateCount();
    slides[idx].scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  animating=true;
  const cur=slides[idx];
  const nxt=slides[next];
  cur.classList.remove('entering');
  cur.classList.add('leaving');

  await playMorphTransition(()=>{
    cur.classList.remove('active','leaving');
    nxt.classList.remove('leaving');
    void nxt.offsetWidth;
    nxt.classList.add('active','entering');
    idx=next; updateCount();
  });

  setTimeout(()=>nxt.classList.remove('entering'), 1400);
  animating=false;
}

async function enterPresent(start=0){
  presenting=true;
  body.classList.add('present');
  btnPresent.textContent='▣ Modo página';
  slides.forEach(s=>s.classList.remove('active','leaving','entering'));
  idx=start; updateCount();

  await playMorphTransition(()=>{
    const first=slides[start];
    void first.offsetWidth;
    first.classList.add('active','entering');
    setTimeout(()=>first.classList.remove('entering'), 1400);
  });

  try{ await document.documentElement.requestFullscreen?.(); }catch{}
}
async function exitPresent(){
  presenting=false;
  body.classList.remove('present');
  btnPresent.textContent='▶ Modo apresentação';
  slides.forEach(s=>s.classList.remove('active','leaving','entering'));
  resetMorph();
  try{ if(document.fullscreenElement) await document.exitFullscreen(); }catch{}
  slides[idx].scrollIntoView({behavior:'smooth',block:'start'});
}
function togglePresent(){ presenting ? exitPresent() : enterPresent(idx); }

btnPresent.addEventListener('click', togglePresent);
btnPresentHero.addEventListener('click', ()=>enterPresent(0));
prevBtn.addEventListener('click', ()=>showSlide(Math.max(0, idx-1)));
nextBtn.addEventListener('click', ()=>showSlide(Math.min(slides.length-1, idx+1)));
exitBtn.addEventListener('click', exitPresent);

window.addEventListener('keydown', (e)=>{
  if(['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if(e.key==='Escape' && presenting){ e.preventDefault(); exitPresent(); return; }
  if((e.key==='f' || e.key==='F') && presenting) document.documentElement.requestFullscreen?.();
  if(!presenting || animating) return;
  if(e.key==='ArrowRight' || e.key==='PageDown' || e.key===' '){ e.preventDefault(); showSlide(Math.min(slides.length-1, idx+1)); }
  if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); showSlide(Math.max(0, idx-1)); }
  if(e.key==='Home'){ e.preventDefault(); showSlide(0); }
  if(e.key==='End'){ e.preventDefault(); showSlide(slides.length-1); }
});

async function copyText(text, okMsg){
  const str = String(text||'');
  if(!str) return;
  let ok=false;
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(str); ok=true; } }catch{}
  if(!ok){
    const ta=document.createElement('textarea');
    ta.value=str; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:8px;left:8px;width:12em;height:4em;opacity:0.01;z-index:9999';
    document.body.appendChild(ta); ta.focus(); ta.setSelectionRange(0, ta.value.length);
    try{ ok=document.execCommand('copy'); }catch{ ok=false; }
    ta.remove();
  }
  toast.textContent = ok ? (okMsg||'Copiado') : 'Copie manualmente';
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1800);
}

document.querySelectorAll('a[target="_blank"]').forEach(a=>{
  a.addEventListener('click', async (e)=>{
    if(!presenting) return;
    e.preventDefault();
    const href=a.href;
    try{ if(document.fullscreenElement) await document.exitFullscreen(); }catch{}
    window.open(href, '_blank', 'noopener,noreferrer');
  });
});
document.querySelectorAll('[data-copy-cmd]').forEach(btn=>btn.addEventListener('click', (e)=>{
  e.preventDefault(); e.stopPropagation();
  copyText(btn.getAttribute('data-copy-cmd'), 'Comando copiado');
}));
const rawMap = {
  'caso-chat': ()=>C.casoMesmo.chat,
  'caso-def': ()=>C.casoMesmo.agenteDef,
  'caso-tarefa': ()=>C.casoMesmo.agenteTarefa,
  'agente-pronto': ()=>C.agentePronto.texto
};
document.querySelectorAll('[data-copy-raw]').forEach(btn=>btn.addEventListener('click', (e)=>{
  e.preventDefault(); e.stopPropagation();
  const fn = rawMap[btn.getAttribute('data-copy-raw')];
  if(fn) copyText(fn(), 'Copiado');
}));

const params = new URLSearchParams(location.search);
const wantId = params.get('slide');
const autoPresent = params.get('present') === '1' || params.get('apresentar') === '1';
if(wantId){
  const found = slides.findIndex(s=>s.dataset.id===wantId);
  if(found>=0) idx=found;
}
updateCount();
document.body.classList.add('page-enter');
setTimeout(()=>document.body.classList.remove('page-enter'), 1000);
if(autoPresent){
  setTimeout(()=>enterPresent(idx), 160);
} else if(wantId && idx>0){
  slides[idx].scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
